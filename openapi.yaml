openapi: 3.1.0
info:
  title: Portfolio API
  version: 1.0.0
  description: API untuk proyek portfolio.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: '{scheme}://{host}'
    description: Server API yang dapat diatur
    variables:
      scheme:
        default: http
        enum:
          - http
          - https
      host:
        default: localhost
security: []
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Aplikasi berjalan
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
        '404':
          description: Endpoint health tidak ditemukan
        '500':
          description: Error server
components:
  schemas: {}
